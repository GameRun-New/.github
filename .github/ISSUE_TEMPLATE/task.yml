name: Task
description: A specific piece of work with no change in product behaviour.
type: Task
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs doing, and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true before this is closed. One per line.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Optional. Links, files or notes. Paste links or drag files in.
