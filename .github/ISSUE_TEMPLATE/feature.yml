name: Feature
description: New behaviour, or a change to how something works today.
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or wrong today, and who it affects.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What will change. Name the screens and the user roles.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true before this is closed. One per line.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Optional. What this does not cover.
  - type: textarea
    id: designs
    attributes:
      label: Designs or references
      description: Optional. Paste links or drag files in. Mockups, screenshots, documents.
